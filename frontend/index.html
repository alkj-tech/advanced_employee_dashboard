<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #f3f7ff 0%, #eef7ff 50%, #f8fbff 100%);
        color: #183153;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 14px 45px rgba(24, 49, 83, 0.12);
      }

      .hero {
        border-radius: 28px;
        padding: 2rem;
      }

      .table-card {
        border-radius: 22px;
        overflow: hidden;
      }

      .table thead {
        background: linear-gradient(90deg, #1d4ed8, #2563eb);
        color: white;
      }

      .btn-primary {
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        border: none;
      }

      .btn-outline-danger {
        border-width: 1.8px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2563eb, #7dd3fc);
        color: white;
        font-weight: 700;
      }

      .stat-pill {
        border-radius: 999px;
        padding: 0.5rem 0.9rem;
        background: #eff6ff;
        color: #1d4ed8;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .hero {
          padding: 1.25rem;
        }
        .table-responsive {
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-4 py-md-5">
      <div class="hero glass-card mb-4">
        <div class="row align-items-center g-4">
          <div class="col-lg-8">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="avatar"><i class="fa-solid fa-users"></i></div>
              <div>
                <h2 class="mb-1">Employee Dashboard</h2>
                <p class="mb-0 text-muted">Manage your workforce with a clean, modern experience.</p>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <span class="stat-pill"><i class="fa-solid fa-chart-line me-2"></i>Live API data</span>
              <span class="stat-pill"><i class="fa-solid fa-mobile-screen me-2"></i>Mobile friendly</span>
              <span class="stat-pill"><i class="fa-solid fa-shield-halved me-2"></i>CRUD ready</span>
            </div>
          </div>
          <div class="col-lg-4 text-lg-end">
            <button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#employeeModal" onclick="resetForm()">
              <i class="fa-solid fa-plus me-2"></i>Add Employee
            </button>
          </div>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="glass-card p-4 rounded-4">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <p class="mb-1 text-muted">Total Employees</p>
                <h3 id="totalCount" class="mb-0">0</h3>
              </div>
              <div class="avatar"><i class="fa-solid fa-user-group"></i></div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card p-4 rounded-4">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <p class="mb-1 text-muted">Active Roles</p>
                <h3 id="roleCount" class="mb-0">0</h3>
              </div>
              <div class="avatar"><i class="fa-solid fa-briefcase"></i></div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card p-4 rounded-4">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <p class="mb-1 text-muted">Data Sync</p>
                <h3 class="mb-0">Live</h3>
              </div>
              <div class="avatar"><i class="fa-solid fa-wifi"></i></div>
            </div>
          </div>
        </div>
      </div>

      <div class="glass-card table-card p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h4 class="mb-0">Employee Directory</h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadEmployees()">
            <i class="fa-solid fa-rotate-right me-1"></i>Refresh
          </button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Salary</th>
                <th>Position</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody">
              <tr>
                <td colspan="4" class="text-center py-4 text-muted">Loading employees...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="employeeModalLabel">Employee Form</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="employeeForm">
              <input type="hidden" id="employeeId" />
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Salary</label>
                <input type="number" id="salary" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Position</label>
                <input type="text" id="position" class="form-control" required />
              </div>
            </form>
          </div>
          <div class="modal-footer border-0">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" onclick="saveEmployee()">Save Employee</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"> </script>
  </body>
</html>
